      operationId: createUser
      summary: createUser
      tags:
      - Registration
      description: 'Create User Account

        Create an Arity userId needed to track the driving behavior of your mobile app end-user.

        URL : https://api.arity.com/registration/v2/users/products

        URL parameters : none

        Method : POST

        Auth required : YES - b2b Oauth token

        Data constraints

        Provide userId of account to be created. Alternatively leave this null and we will return a unique string.

        Provide a deviceId for this user. Alternatively leave this null and we will return a unique string.

        Indicate that your user is enrolled in the Driving Behavior product'
      responses:
        default:
          description: Response shape not documented in the source collection.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              userId: ''
              deviceId: ''
              products:
              - Driving Behavior
